{% extends "accounts/auth_base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<h4 class="text-center mb-4">Student Login</h4>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Sign In</button></form>
<p class="text-center mt-3"><a href="{% url 'register' %}">Create account</a> &middot; <a href="{% url 'password_reset' %}">Forgot password?</a></p>
{% endblock %}
