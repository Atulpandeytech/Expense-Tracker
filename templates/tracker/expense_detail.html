{% extends "base.html" %}
{% block content %}<div class="col-md-7 mx-auto"><div class="card p-4"><h4>{{ expense.title }}</h4><table class="table"><tr><th>Amount</th><td>Rs. {{ expense.amount|floatformat:2 }}</td></tr><tr><th>Date</th><td>{{ expense.date|date:"d F Y" }}</td></tr><tr><th>Category</th><td>{{ expense.category.name }}</td></tr><tr><th>Description</th><td>{{ expense.description|default:"No description" }}</td></tr></table><a class="btn btn-primary" href="{% url 'expense_update' expense.pk %}">Edit Expense</a><a class="btn btn-danger" href="{% url 'expense_delete' expense.pk %}">Delete</a><a class="btn btn-secondary" href="{% url 'expense_list' %}">Back</a></div></div>{% endblock %}
